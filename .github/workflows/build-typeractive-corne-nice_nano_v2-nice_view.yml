name: "Build Typeractive corne nice_nano_v2 nice_view"
on: workflow_dispatch
jobs:
  build:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano@2.0.0//zmk"]'
      # nice_view_gem replaces the stock nice_view shield. It comes from the
      # module below, and it needs nice_view_adapter in the same way.
      shield: '["corne_left nice_view_adapter nice_view_gem","corne_right nice_view_adapter nice_view_gem"]'
      # The module revision must match the ZMK revision. main.yml clones ZMK
      # main, so the module uses its main branch.
      modules: '["M165437/nice-view-gem/main"]'
      # Kconfig lives in config/corne.conf. Do not set kconfig here: the workflow
      # writes it to config/corne_left.conf, which ZMK ignores when corne.conf exists.
