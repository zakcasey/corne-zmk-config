# Kconfig settings for both halves.
#
# ZMK reads a shared "corne.conf" for corne_left and corne_right. If this file
# exists, ZMK ignores corne_left.conf and corne_right.conf. Do not let the build
# workflow write a kconfig value, because that goes to corne_left.conf and has
# no effect while this file is here. Put all Kconfig settings below instead.
# https://zmk.dev/docs/config

# Deep sleep after 15 minutes with no key presses. This saves battery.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=900000

# nice!view screens. No shield turns the display on by itself, so it must be
# set here. The nice-view-gem module supplies the custom status screen. Pin the
# module to the ZMK revision the build uses: this repo builds ZMK main, so the
# module uses its main branch.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
